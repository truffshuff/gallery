name: Edit-ready mutation verification
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: edit-ready-mutation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Database baseline, mutation, restored guard
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout guarded source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@caac7f7e4298458a14238959504f411fc6cc7f06
        with:
          github_token: ${{ github.token }}
      - name: Install server dependencies
        run: mise run //server:install
      - name: Build workspace plugins
        run: mise run //:plugins
      - name: Verify database matrix detects guard removal
        run: python3 .github/scripts/verify-edit-ready-mutation.py
      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: edit-ready-mutation-evidence
          path: mutation-evidence/
          if-no-files-found: warn
