name: Verify PR 1346 x64 end-to-end tests
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr-1346-x64-e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e2e-tests-server-cli:
    name: End-to-End Tests (Server & CLI)
    timeout-minutes: 35
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: ./e2e
    strategy:
      matrix:
        runner: [ubuntu-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: 'recursive'
          token: ${{ github.token }}

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Setup packages
        run: pnpm --filter @immich/sdk --filter @immich/cli install --frozen-lockfile && pnpm --filter @immich/sdk --filter @immich/cli build
        working-directory: .

      - name: Run setup web
        run: pnpm install --frozen-lockfile && pnpm exec svelte-kit sync
        working-directory: ./web

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Free disk space
        working-directory: ./
        # The job builds the full server + ML images and loads the geodata (geonames)
        # dataset into Postgres on the same runner. On a runner image that ships with
        # little free disk, Postgres fails the geodata_places primary-key build with
        # "No space left on device" and the server never boots. Reclaim the preinstalled
        # toolchains we don't use before the build. Paths are absolute and missing paths
        # are ignored, so this is safe on both the x86 and arm runners.
        # Runs before the buildx/cache setup below so the image prune cannot discard it.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Start Docker Compose
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            docker compose up -d --build --renew-anon-volumes --force-recreate --remove-orphans --wait --wait-timeout 300 2>&1 | tee "${RUNNER_TEMP}/docker-compose-up.log" && exit 0
            grep -q toomanyrequests "${RUNNER_TEMP}/docker-compose-up.log" || exit 1
            sleep $((attempt * 15))
          done
          exit 1
      - name: Wait for e2e server
        run: node ../.github/scripts/wait-for-url.mjs http://127.0.0.1:2285/api/server/ping
      - name: Run e2e tests (api & cli)
        env:
          VITEST_DISABLE_DOCKER_SETUP: true
        run: pnpm test
      - name: Run e2e tests (maintenance)
        env:
          VITEST_DISABLE_DOCKER_SETUP: true
        run: pnpm test:maintenance
      - name: Capture Docker diagnostics
        if: always()
        run: |
          docker compose ps -a > docker-compose-ps.txt || true
          docker inspect immich-e2e-server immich-e2e-auth-server immich-e2e-postgres immich-e2e-redis > docker-inspect.json 2> docker-inspect.err || true
          node ../.github/scripts/wait-for-url.mjs http://127.0.0.1:2285/api/server/ping > e2e-server-final-ping.txt 2>&1 || true
      - name: Capture Docker logs
        if: always()
        run: docker compose logs --no-color > docker-compose-logs.txt 2>&1 || true
        working-directory: ./e2e

      - name: Archive Docker logs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-server-docker-logs-${{ matrix.runner }}
          path: |
            e2e/docker-compose-logs.txt
            e2e/docker-compose-ps.txt
            e2e/docker-inspect.json
            e2e/docker-inspect.err
            e2e/e2e-server-final-ping.txt
