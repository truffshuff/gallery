name: Investigate issue 916 date-edit permissions
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  investigate:
    name: Real database album and Space date-edit scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout current server and investigation tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@caac7f7e4298458a14238959504f411fc6cc7f06
        with:
          github_token: ${{ github.token }}
      - name: Install server dependencies
        run: mise run //server:install
      - name: Build workspace plugins
        run: mise run //:plugins
      - name: Exercise the actual service and existing Space permission regressions
        shell: bash
        run: |
          mise exec -- pnpm --dir server exec vitest --config test/vitest.config.medium.mjs run test/medium/specs/gallery/issue-916-album-edit-investigation.medium.spec.ts test/medium/specs/repositories/access-space-edit.repository.spec.ts test/medium/specs/services/space-editor-asset-edit.medium.spec.ts 2>&1 | tee investigation-916.log
      - name: Upload investigation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: issue-916-database-investigation
          path: investigation-916.log
          if-no-files-found: warn
