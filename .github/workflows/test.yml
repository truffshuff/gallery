name: Space stack share mutation verification
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: space-stack-share-mutation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Database matrix, original regression, removed gates, restored guards
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout guarded source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 32
          persist-credentials: false
      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@caac7f7e4298458a14238959504f411fc6cc7f06
        with:
          github_token: ${{ github.token }}
      - name: Install server dependencies
        run: mise run //server:install
      - name: Build workspace plugins
        run: mise run //:plugins
      - name: Verify the real database matrix and its mutations
        run: python3 .github/scripts/verify-space-stack-share-mutation.py
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: space-stack-share-mutation-evidence
          path: mutation-evidence/
          if-no-files-found: warn
